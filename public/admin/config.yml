backend:
  name: git-gateway
  branch: main

# For local development: uncomment the line below and run `npx decap-server`
# local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:

  # ── Site content ───────────────────────────────────────────────────────────
  - name: "site"
    label: "Site Content"
    files:
      - name: "main"
        label: "Main Content"
        file: "src/content/site/main.json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "CTA Label", name: "cta_label", widget: "string" }
              - { label: "CTA Link",  name: "cta_href",  widget: "string" }

          - label: "The How"
            name: "the_how"
            widget: "object"
            fields:
              - { label: "Section label (heading)", name: "label",  widget: "string" }
              - { label: "Text block 1 (left column)", name: "block1", widget: "text" }
              - { label: "Text block 2 (right — bold quote)", name: "block2", widget: "text" }
              - { label: "Text block 3 (right — body)", name: "block3", widget: "text" }

          - label: "Questions section"
            name: "questions_section"
            widget: "object"
            fields:
              - { label: "Section heading", name: "heading", widget: "string" }
              - label: "Questions"
                name: "questions"
                widget: "list"
                field: { label: "Question", name: "question", widget: "string" }

          - label: "About (Who am I)"
            name: "about"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Bio",     name: "body",    widget: "text" }
              - { label: "Photo",   name: "image",   widget: "image", required: false }

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email",       name: "email",    widget: "string" }
              - { label: "Phone",       name: "phone",    widget: "string", required: false }
              - { label: "Location",    name: "location", widget: "string", required: false }
              - { label: "Calendly URL",name: "calendly", widget: "string", required: false }

  # ── Services ────────────────────────────────────────────────────────────────
  - name: "services"
    label: "Services"
    label_singular: "Service"
    folder: "src/content/services"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - { label: "Title",       name: "title",       widget: "string" }
      - { label: "Tagline",     name: "tagline",     widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Details (bullet points)"
        name: "details"
        widget: "list"
        field: { label: "Item", name: "item", widget: "string" }
      - { label: "Order (1 = first)", name: "order", widget: "number", default: 1 }

  # ── Blog ────────────────────────────────────────────────────────────────────
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Post"
    folder: "src/content/blog"
    create: true
    extension: "md"
    fields:
      - { label: "Title",       name: "title",       widget: "string" }
      - { label: "Date",        name: "pubDate",     widget: "datetime" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Draft",       name: "draft",       widget: "boolean", default: true }
      - { label: "Body",        name: "body",        widget: "markdown" }
