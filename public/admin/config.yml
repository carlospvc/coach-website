backend:
  name: git-gateway
  branch: main

# local_backend: true  # uncomment + run `npx decap-server` for local dev

media_folder: "public/images"
public_folder: "/images"

collections:

  # ── 1. HERO ────────────────────────────────────────────────────────────────
  - name: "hero"
    label: "Hero"
    files:
      - name: "hero"
        label: "Hero"
        file: "src/content/site/hero.json"
        fields:
          - { label: "Hero — Tagline EN (use the Bold button to make words bold)", name: "tagline", widget: "markdown" }
          - { label: "Hero — Tagline DE", name: "tagline_de", widget: "markdown" }
          - { label: "Hero — Button text EN", name: "cta_label", widget: "string" }
          - { label: "Hero — Button text DE", name: "cta_label_de", widget: "string" }
          - { label: "Hero — Button link (e.g. #contact)", name: "cta_href", widget: "string" }

  # ── 2. THE HOW ─────────────────────────────────────────────────────────────
  - name: "the-how"
    label: "How I work"
    files:
      - name: "the-how"
        label: "How I work"
        file: "src/content/site/the-how.json"
        fields:
          - { label: "The How — Section heading EN (displayed large, e.g. THE HOW)", name: "label", widget: "string" }
          - { label: "The How — Section heading DE", name: "label_de", widget: "string" }
          - { label: "The How — Left column text EN", name: "block1", widget: "markdown", required: false }
          - { label: "The How — Left column text DE", name: "block1_de", widget: "markdown", required: false }
          - { label: "The How — Right column: main statement EN (large display)", name: "block2", widget: "markdown" }
          - { label: "The How — Right column: main statement DE", name: "block2_de", widget: "markdown" }
          - { label: "The How — Right column: supporting paragraph EN", name: "block3", widget: "markdown", required: false }
          - { label: "The How — Right column: supporting paragraph DE", name: "block3_de", widget: "markdown", required: false }

  # ── 3. QUESTIONS (Is this right for you?) ─────────────────────────────────
  - name: "questions"
    label: "Is this right for you?"
    files:
      - name: "questions"
        label: "Is this right for you?"
        file: "src/content/site/questions.json"
        fields:
          - { label: "Questions — Section heading EN (displayed above the rotating questions)", name: "heading", widget: "markdown" }
          - { label: "Questions — Section heading DE", name: "heading_de", widget: "markdown" }
          - label: "Questions — Rotating questions EN (displayed one at a time, in order)"
            name: "questions"
            widget: "list"
            field: { label: "Question text", name: "question", widget: "string" }
          - label: "Questions — Rotating questions DE"
            name: "questions_de"
            widget: "list"
            field: { label: "Frage", name: "question", widget: "string" }

  # ── 4. SERVICES ────────────────────────────────────────────────────────────
  - name: "services-section"
    label: "Services — Section heading"
    files:
      - name: "services-section"
        label: "Services — Section heading"
        file: "src/content/site/services-section.json"
        fields:
          - { label: "Services — Heading: normal weight part EN (e.g. Four paths in.)", name: "heading_plain", widget: "string" }
          - { label: "Services — Heading: normal weight part DE", name: "heading_plain_de", widget: "string" }
          - { label: "Services — Heading: bold part EN (e.g. One foundation.)", name: "heading_bold", widget: "string" }
          - { label: "Services — Heading: bold part DE", name: "heading_bold_de", widget: "string" }
          - { label: "Services — Lead paragraph EN (shown below heading)", name: "lead", widget: "string" }
          - { label: "Services — Lead paragraph DE", name: "lead_de", widget: "string" }

  - name: "services"
    label: "Services — Individual services"
    label_singular: "Service"
    folder: "src/content/services"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - { label: "Service — Title EN (e.g. 1:1 Coaching)", name: "title", widget: "string" }
      - { label: "Service — Title DE", name: "title_de", widget: "string" }
      - { label: "Service — Tagline EN (short phrase displayed below title)", name: "tagline", widget: "string" }
      - { label: "Service — Tagline DE", name: "tagline_de", widget: "string" }
      - { label: "Service — Description paragraph EN", name: "description", widget: "markdown" }
      - { label: "Service — Description paragraph DE", name: "description_de", widget: "markdown" }
      - label: "Service — Detail bullet points (displayed below description)"
        name: "details"
        widget: "list"
        field: { label: "Bullet point text", name: "item", widget: "string" }
      - { label: "Service — Display order (1 = first, 2 = second, etc.)", name: "order", widget: "number", default: 1 }

  # ── 5. TESTIMONIALS ────────────────────────────────────────────────────────
  - name: "testimonials-heading"
    label: "Testimonials — Section heading"
    files:
      - name: "testimonials-section"
        label: "Testimonials — Section heading"
        file: "src/content/site/testimonials-section.json"
        fields:
          - { label: "Testimonials — Section heading EN", name: "heading", widget: "markdown" }
          - { label: "Testimonials — Section heading DE", name: "heading_de", widget: "markdown" }

  - name: "testimonials"
    label: "Testimonials — Quotes"
    label_singular: "Testimonial"
    folder: "src/content/testimonials"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    fields:
      - { label: "Testimonial — Published (tick to show on website)", name: "published", widget: "boolean", default: false }
      - { label: "Testimonial — Quote text (what the person said)", name: "quote", widget: "markdown" }
      - { label: "Testimonial — First and last name", name: "name", widget: "string" }
      - { label: "Testimonial — Position / Role (e.g. CEO)", name: "position", widget: "string" }
      - { label: "Testimonial — Company / Organisation", name: "company", widget: "string" }
      - { label: "Testimonial — Photo (optional, shown in B&W — upload a file or paste an external URL. Leave empty to show initials instead)", name: "photo", widget: "image", required: false }
      - { label: "Testimonial — Display order (1 = top left, 2 = top right, etc.)", name: "order", widget: "number", default: 1 }

  # ── 6. WHO AM I ────────────────────────────────────────────────────────────
  - name: "who-am-i"
    label: "Who am I"
    files:
      - name: "who-am-i"
        label: "Who am I"
        file: "src/content/site/aboutme.json"
        fields:
          - { label: "Who am I — Section heading EN (e.g. Who I am.)", name: "heading", widget: "string" }
          - { label: "Who am I — Section heading DE", name: "heading_de", widget: "string" }
          - { label: "Who am I — Bio EN (separate paragraphs with a blank line)", name: "bio", widget: "markdown" }
          - { label: "Who am I — Bio DE", name: "bio_de", widget: "markdown" }

  # ── 7. CONTACT ─────────────────────────────────────────────────────────────
  - name: "contact"
    label: "Contact"
    files:
      - name: "contact"
        label: "Contact"
        file: "src/content/site/contact.json"
        fields:
          - { label: "Contact — Heading: normal weight part EN (e.g. No pressure.)", name: "heading_plain", widget: "string" }
          - { label: "Contact — Heading: normal weight part DE", name: "heading_plain_de", widget: "string" }
          - { label: "Contact — Heading: bold part EN (e.g. Just clarity.)", name: "heading_bold", widget: "string" }
          - { label: "Contact — Heading: bold part DE", name: "heading_bold_de", widget: "string" }
          - { label: "Contact — Introductory paragraph EN", name: "intro", widget: "markdown" }
          - { label: "Contact — Introductory paragraph DE", name: "intro_de", widget: "markdown" }
          - { label: "Contact — Location label EN", name: "detail_location_label", widget: "string" }
          - { label: "Contact — Location label DE", name: "detail_location_label_de", widget: "string" }
          - { label: "Contact — Location value", name: "detail_location_value", widget: "string" }
          - { label: "Contact — Availability label EN", name: "detail_availability_label", widget: "string" }
          - { label: "Contact — Availability label DE", name: "detail_availability_label_de", widget: "string" }
          - { label: "Contact — Availability value EN", name: "detail_availability_value", widget: "string" }
          - { label: "Contact — Availability value DE", name: "detail_availability_value_de", widget: "string" }
          - { label: "Contact — Format label EN", name: "detail_format_label", widget: "string" }
          - { label: "Contact — Format label DE", name: "detail_format_label_de", widget: "string" }
          - { label: "Contact — Format value EN (e.g. Remote · In-person)", name: "detail_format_value", widget: "string" }
          - { label: "Contact — Format value DE", name: "detail_format_value_de", widget: "string" }
          - { label: "Contact — Languages label EN", name: "detail_languages_label", widget: "string" }
          - { label: "Contact — Languages label DE", name: "detail_languages_label_de", widget: "string" }
          - { label: "Contact — Languages value (e.g. EN · FR · DE)", name: "detail_languages_value", widget: "string" }

  # ── 8. FOOTER ──────────────────────────────────────────────────────────────
  - name: "footer"
    label: "Footer"
    files:
      - name: "footer"
        label: "Footer"
        file: "src/content/site/footer.json"
        fields:
          - { label: "Footer — Wordmark (large name displayed at the bottom)", name: "wordmark", widget: "string" }
          - { label: "Footer — Copyright line EN", name: "copyright", widget: "string" }
          - { label: "Footer — Copyright line DE", name: "copyright_de", widget: "string" }
          - { label: "Footer — Tagline EN (right side, e.g. Zürich · Worldwide · By application)", name: "tagline", widget: "string" }
          - { label: "Footer — Tagline DE", name: "tagline_de", widget: "string" }

  # ── 9. ACCREDITATIONS ─────────────────────────────────────────────────────
  - name: "accreditations-heading"
    label: "Accreditations — Section heading"
    files:
      - name: "accreditations-section"
        label: "Accreditations — Section heading"
        file: "src/content/site/accreditations-section.json"
        fields:
          - { label: "Accreditations — Section heading EN (e.g. Trained & Certified)", name: "heading", widget: "string" }
          - { label: "Accreditations — Section heading DE", name: "heading_de", widget: "string" }

  - name: "accreditations"
    label: "Accreditations — Certifications"
    label_singular: "Accreditation"
    folder: "src/content/accreditations"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    fields:
      - { label: "Accreditation — Full name (e.g. Professional Certified Coach)", name: "name", widget: "string" }
      - { label: "Accreditation — Initials shown in circle when no image (e.g. PCC)", name: "initials", widget: "string" }
      - { label: "Accreditation — Issuing organisation", name: "issuer", widget: "string" }
      - { label: "Accreditation — Logo / Badge (optional — upload a file or paste a URL. Leave empty to show initials)", name: "photo", widget: "image", required: false }
      - { label: "Accreditation — Display order (1 = first)", name: "order", widget: "number", default: 1 }

  # ── 10. PRIVACY POLICY ─────────────────────────────────────────────────────
  - name: "privacy"
    label: "Privacy Policy"
    files:
      - name: "privacy"
        label: "Privacy Policy"
        file: "src/content/site/privacy.json"
        fields:
          - { label: "Privacy Policy — Page title EN", name: "title", widget: "string" }
          - { label: "Privacy Policy — Page title DE", name: "title_de", widget: "string" }
          - { label: "Privacy Policy — Last updated EN (e.g. May 2026)", name: "updated", widget: "string" }
          - { label: "Privacy Policy — Last updated DE (e.g. Mai 2026)", name: "updated_de", widget: "string" }
          - { label: "Privacy Policy — Body text EN (use ## for section headings, leave a blank line between paragraphs)", name: "body", widget: "markdown" }
          - { label: "Privacy Policy — Body text DE", name: "body_de", widget: "markdown" }
