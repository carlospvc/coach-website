backend:
  name: git-gateway
  branch: main

# local_backend: true  # uncomment + run `npx decap-server` for local dev

media_folder: "public/images"
public_folder: "/images"

collections:

  # ── 1. HERO ────────────────────────────────────────────────────────────────
  - name: "hero"
    label: "Hero"
    files:
      - name: "hero"
        label: "Hero"
        file: "src/content/site/hero.json"
        fields:
          - { label: "Hero — Tagline (use the Bold button to make words bold)", name: "tagline", widget: "markdown" }
          - { label: "Hero — Button text", name: "cta_label", widget: "string" }
          - { label: "Hero — Button link (e.g. #contact)", name: "cta_href", widget: "string" }

  # ── 2. THE HOW ─────────────────────────────────────────────────────────────
  - name: "the-how"
    label: "The How"
    files:
      - name: "the-how"
        label: "The How"
        file: "src/content/site/the-how.json"
        fields:
          - { label: "The How — Section heading (displayed large, e.g. THE HOW)", name: "label", widget: "string" }
          - { label: "The How — Left column text", name: "block1", widget: "markdown", required: false }
          - { label: "The How — Right column: main statement (large display)", name: "block2", widget: "markdown" }
          - { label: "The How — Right column: supporting paragraph", name: "block3", widget: "markdown", required: false }

  # ── 3. QUESTIONS (Is this right for you?) ─────────────────────────────────
  - name: "questions"
    label: "Is this right for you?"
    files:
      - name: "questions"
        label: "Is this right for you?"
        file: "src/content/site/questions.json"
        fields:
          - { label: "Questions — Section heading (displayed above the rotating questions)", name: "heading", widget: "markdown" }
          - label: "Questions — Rotating questions (displayed one at a time, in order)"
            name: "questions"
            widget: "list"
            field: { label: "Question text", name: "question", widget: "string" }

  # ── 4. SERVICES ────────────────────────────────────────────────────────────
  - name: "services"
    label: "Services"
    label_singular: "Service"
    folder: "src/content/services"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - { label: "Service — Title (e.g. 1:1 Coaching)", name: "title", widget: "string" }
      - { label: "Service — Tagline (short phrase displayed below title)", name: "tagline", widget: "string" }
      - { label: "Service — Description paragraph", name: "description", widget: "markdown" }
      - label: "Service — Detail bullet points (displayed below description)"
        name: "details"
        widget: "list"
        field: { label: "Bullet point text", name: "item", widget: "string" }
      - { label: "Service — Display order (1 = first, 2 = second, etc.)", name: "order", widget: "number", default: 1 }

  # ── 5. TESTIMONIALS ────────────────────────────────────────────────────────
  - name: "testimonials-heading"
    label: "Testimonials — Section heading"
    files:
      - name: "testimonials-section"
        label: "Testimonials — Section heading"
        file: "src/content/site/testimonials-section.json"
        fields:
          - { label: "Testimonials — Section heading", name: "heading", widget: "markdown" }

  - name: "testimonials"
    label: "Testimonials — Quotes"
    label_singular: "Testimonial"
    folder: "src/content/testimonials"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    fields:
      - { label: "Testimonial — Published (tick to show on website)", name: "published", widget: "boolean", default: false }
      - { label: "Testimonial — Quote text (what the person said)", name: "quote", widget: "markdown" }
      - { label: "Testimonial — First and last name", name: "name", widget: "string" }
      - { label: "Testimonial — Position / Role (e.g. CEO)", name: "position", widget: "string" }
      - { label: "Testimonial — Company / Organisation", name: "company", widget: "string" }
      - { label: "Testimonial — Photo (optional, shown in B&W — upload a file or paste an external URL. Leave empty to show initials instead)", name: "photo", widget: "image", required: false }
      - { label: "Testimonial — Display order (1 = top left, 2 = top right, etc.)", name: "order", widget: "number", default: 1 }

  # ── 6. WHO AM I ────────────────────────────────────────────────────────────
  - name: "who-am-i"
    label: "Who am I"
    files:
      - name: "who-am-i"
        label: "Who am I"
        file: "src/content/site/aboutme.json"
        fields:
          - { label: "Who am I — Bio (separate paragraphs with a blank line)", name: "bio", widget: "markdown" }
          - { label: "Who am I — Lesson label (small text above quote, e.g. Lesson carried forward)", name: "lesson_label", widget: "string" }
          - { label: "Who am I — Lesson quote text", name: "lesson_text", widget: "markdown" }

  # ── 7. CONTACT ─────────────────────────────────────────────────────────────
  - name: "contact"
    label: "Contact"
    files:
      - name: "contact"
        label: "Contact"
        file: "src/content/site/contact.json"
        fields:
          - { label: "Contact — Heading: normal weight part (e.g. No pressure.)", name: "heading_plain", widget: "string" }
          - { label: "Contact — Heading: bold part (e.g. Just clarity.)", name: "heading_bold", widget: "string" }
          - { label: "Contact — Introductory paragraph", name: "intro", widget: "markdown" }
          - { label: "Contact — Location label", name: "detail_location_label", widget: "string" }
          - { label: "Contact — Location value", name: "detail_location_value", widget: "string" }
          - { label: "Contact — Availability label", name: "detail_availability_label", widget: "string" }
          - { label: "Contact — Availability value", name: "detail_availability_value", widget: "string" }
          - { label: "Contact — Format label", name: "detail_format_label", widget: "string" }
          - { label: "Contact — Format value (e.g. Remote · In-person)", name: "detail_format_value", widget: "string" }
          - { label: "Contact — Languages label", name: "detail_languages_label", widget: "string" }
          - { label: "Contact — Languages value (e.g. EN · FR · DE)", name: "detail_languages_value", widget: "string" }

  # ── 8. FOOTER ──────────────────────────────────────────────────────────────
  - name: "footer"
    label: "Footer"
    files:
      - name: "footer"
        label: "Footer"
        file: "src/content/site/footer.json"
        fields:
          - { label: "Footer — Wordmark (large name displayed at the bottom)", name: "wordmark", widget: "string" }
          - { label: "Footer — Copyright line", name: "copyright", widget: "string" }
          - { label: "Footer — Tagline (right side, e.g. Zürich · Worldwide · By application)", name: "tagline", widget: "string" }

  # ── 9. ACCREDITATIONS ─────────────────────────────────────────────────────
  - name: "accreditations-heading"
    label: "Accreditations — Section heading"
    files:
      - name: "accreditations-section"
        label: "Accreditations — Section heading"
        file: "src/content/site/accreditations-section.json"
        fields:
          - { label: "Accreditations — Section heading (e.g. Trained & Certified)", name: "heading", widget: "string" }

  - name: "accreditations"
    label: "Accreditations — Certifications"
    label_singular: "Accreditation"
    folder: "src/content/accreditations"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    fields:
      - { label: "Accreditation — Full name (e.g. Professional Certified Coach)", name: "name", widget: "string" }
      - { label: "Accreditation — Initials shown in circle when no image (e.g. PCC)", name: "initials", widget: "string" }
      - { label: "Accreditation — Issuing organisation", name: "issuer", widget: "string" }
      - { label: "Accreditation — Logo / Badge (optional — upload a file or paste a URL. Leave empty to show initials)", name: "photo", widget: "image", required: false }
      - { label: "Accreditation — Display order (1 = first)", name: "order", widget: "number", default: 1 }

  # ── 10. PRIVACY POLICY ─────────────────────────────────────────────────────
  - name: "privacy"
    label: "Privacy Policy"
    files:
      - name: "privacy"
        label: "Privacy Policy"
        file: "src/content/site/privacy.json"
        fields:
          - { label: "Privacy Policy — Page title", name: "title", widget: "string" }
          - { label: "Privacy Policy — Last updated (e.g. May 2026)", name: "updated", widget: "string" }
          - { label: "Privacy Policy — Body text (use ## for section headings, leave a blank line between paragraphs)", name: "body", widget: "markdown" }
