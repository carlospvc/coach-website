[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirects — SPA fallback (not needed for static, but useful if you add SSR later)
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

[context.production]
  environment = { NODE_ENV = "production" }

# ── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking (embedding the site in an iframe on another domain)
    X-Frame-Options = "DENY"
    # Stop browsers from guessing MIME types (prevents certain injection attacks)
    X-Content-Type-Options = "nosniff"
    # Control what info is sent in the Referer header
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restrict browser features (camera, mic, etc.) — none needed for this site
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Force HTTPS for 1 year (only takes effect once served over HTTPS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy — allow resources only from own domain + known CDNs
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://media.licdn.com https://geographie.uibk.ac.at; font-src 'self'; connect-src 'self' https://identity.netlify.com https://api.netlify.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
