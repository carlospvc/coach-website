[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirects — SPA fallback (not needed for static, but useful if you add SSR later)
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

[context.production]
  environment = { NODE_ENV = "production" }
