[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirects — SPA fallback (not needed for static, but useful if you add SSR later)
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

[context.production]
  environment = { NODE_ENV = "production" }

# ── Security headers ────────────────────────────────────────────────────────

# Admin panel — permissive CSP (Decap CMS loads from unpkg.com + Netlify Identity)
# Safe to open up: /admin is protected by Netlify Identity authentication
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:"

# Public site — strict CSP
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://media.licdn.com https://geographie.uibk.ac.at; font-src 'self'; connect-src 'self' https://identity.netlify.com https://api.netlify.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
